name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG'] == 'v'+json.load(open('skin.json'))['version'], 'Tag and manifest version differ'"
      - run: python tools/build.py --check --release
      - run: node --check libraryroot.custom.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python tools/package-previews.py
      - name: Checksum release downloads
        run: sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "HYPERSHIFT ${RELEASE_TAG#v} — Your games. A whole new energy." --notes-file docs/RELEASE-NOTES.md
