name: Validate theme

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py --check --release
      - run: node --check libraryroot.custom.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
